name: CI

on:
  pull_request:
    # ⛔ SEM `branches: [main]` — de propósito, e é a correção de um buraco MEDIDO.
    #
    # O filtro `branches:` casa a base da PR. Com ele, PR empilhada (base = outra
    # branch de trabalho) não disparava run NENHUMA, e podia ser mergeada sem uma
    # única verificação. Aconteceu com a PR #156: base
    # `fix/column-type-registry-structural`, mergeada em 2026-08-10T21:07:31Z — e a
    # primeira run do `check` nesse commit só nasceu às 21:09:14Z, 1m43s DEPOIS,
    # vinda da PR de recuperação (#157). O conteúdo foi pra uma branch que já havia
    # sido mergeada e ficou órfão.
    #
    # ⚠️ Cuidado ao investigar isso: `check-runs` se prendem ao COMMIT, não à PR.
    # Listar os checks do head da #156 mostra o `check` verde e dá a impressão de que
    # rodou — é a run da PR seguinte, no mesmo SHA. O que separa os dois é o
    # timestamp, não a presença.
    #
    # Custo aceito: PR contra qualquer base roda o CI (mais minutos). O benefício é
    # nenhuma PR poder ser mergeada sem verificação.
    #
    # `ready_for_review` NÃO está no conjunto default (opened, synchronize,
    # reopened) e é obrigatório aqui: o step de showcase é pulado enquanto a PR
    # é rascunho, então sair de rascunho TEM que disparar uma run nova. Sem
    # isso, a run verde do rascunho satisfaria o required status check `check`
    # e o showcase nunca seria avaliado (ver comentário do step, no fim).
    #
    # `edited` dispara quando a BASE muda — inclusive no re-alvo automático que o
    # GitHub faz quando a branch-pai é mergeada. Sem ele, uma PR re-alvejada pra
    # `main` mantinha a run antiga (feita contra a base velha) como sinal válido.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ratchet precisa do histórico pro merge-base

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

      # O registry-app (endpoint que serve o registry pro consumidor) tem
      # package.json e lockfile PRÓPRIOS e, até 2026-07-29, NENHUM workflow o
      # tocava: quebra de build e deriva de dependência só apareciam no deploy —
      # foi assim que ele ficou com `next` vulnerável e o lock pinando 15.5.19.
      - name: registry-app — install (lockfile próprio)
        run: npm ci
        working-directory: registry-app

      - name: registry-app — typecheck
        run: npx tsc --noEmit
        working-directory: registry-app

      # `next build` é o que a Vercel roda. Barato (~3s) e é a única forma de
      # pegar quebra no route handler antes do deploy.
      - name: registry-app — build (o que a Vercel roda)
        run: npx next build
        working-directory: registry-app

      # INFORMATIVO de propósito, mesmo critério do débito de distribuição: o
      # resultado depende do banco de advisories, que muda sem ninguém tocar no
      # código — bloquear aqui reprovaria a PR de outra pessoa por um advisory
      # publicado no meio do caminho. A forma bloqueante vive no `release:check`.
      # ⛔ Ao ver falha aqui, NÃO rode `npm audit fix --force` neste app: o npm
      # agrega os ranges do next e "corrige" fazendo downgrade pra 9.3.3.
      - name: registry-app — audit (informativo)
        run: npm audit --audit-level=high || echo "::warning title=registry-app::advisory HIGH+ no endpoint público — ver //next e //overrides no registry-app/package.json antes de mexer"
        working-directory: registry-app

      - name: Registry consistency (paths + embed)
        run: node scripts/registry-check.mjs

      # Marca incompleta não quebra build, tsc nem teste — só não chega em algum
      # canal. 8 das 10 superfícies falham em silêncio (ver lib/brand-surfaces.mjs).
      - name: Brand surfaces (toda marca do catálogo nas 10 superfícies)
        run: node scripts/brand-check.mjs

      - name: Foundationals sync (DS ↔ CLI baked)
        run: node scripts/check-foundationals.mjs

      - name: Examples ↔ showcase drift
        run: node scripts/examples-drift-check.mjs --ci

      # Os TRÊS steps de conformidade abaixo levam `if: !cancelled()` de
      # propósito: sem isso o primeiro a sair 1 impede os outros de rodarem, e
      # uma PR com `gap-4` E sem Doc page viraria 2 idas-e-voltas em vez de 1.
      # `!cancelled()` roda o step mesmo após falha anterior — o job continua
      # falhando no fim (é step falhado, não `continue-on-error`).
      - name: Lint de estilos (ratchet — só linhas adicionadas)
        if: ${{ !cancelled() }}
        run: node scripts/lint-styles.mjs --ratchet origin/${{ github.base_ref || 'main' }}

      # SEM --ci de propósito: informativo. Bloquear na PR colidiria com a
      # Regra 8 (distribuição consolida no /ds-release, não por-PR-de-
      # componente). A forma bloqueante vive no release:check.
      - name: Débito de distribuição (informativo)
        if: ${{ !cancelled() }}
        run: node scripts/distribution-debt.mjs

      # O guard de rascunho ADIA o check, não dispensa: enquanto a PR é
      # rascunho o step é pulado (quem abre draft pra pedir opinião no meio do
      # caminho não é bloqueado). O que fecha a brecha é `ready_for_review` no
      # `types:` lá no topo — sair de rascunho dispara uma run nova, e é ELA que
      # avalia o showcase. Sem esse trigger, a run verde do rascunho satisfaria
      # o required status check `check` (strict: false) e o guard seria um
      # bypass permanente, não um adiamento: `ready_for_review` não está no
      # conjunto default de atividades do `pull_request`, e step pulado dentro
      # de job que passou não deixa sinal na UI de Checks.
      - name: Showcase registrado (L-042 superfície 4)
        if: ${{ !cancelled() && github.event.pull_request.draft != true }}
        run: node scripts/showcase-check.mjs origin/${{ github.base_ref || 'main' }}

      # Ponto cego do step acima: ele só olha componente NOVO (pasta ausente no
      # base ref), por design. Mudança em componente EXISTENTE não dispara nada —
      # e é o cenário mais provável de um contribuidor de fora. Caso real: a PR
      # #60 adicionou `mode` ao DatePicker e ficou 11 dias sem doc, com o showcase
      # ensinando o padrão que a prop tornou obsoleto. INFORMATIVO: o proxy
      # ("adicionou linha `export`") é de baixo ruído mas não é perfeito — helper
      # exportado num refactor é falso-positivo legítimo, e aviso que atrapalha
      # vira aviso ignorado (L-059).
      - name: API ampliada sem doc (informativo)
        if: ${{ !cancelled() }}
        run: node scripts/api-doc-check.mjs origin/${{ github.base_ref || 'main' }}

      # Integridade do pacote npm, escopada ao que pode quebrá-la. Sem isto, a
      # quebra só aparecia no Passo 7 do release — ou seja, no PIOR momento
      # possível: com o token do mantenedor já vivo, querendo publicar. Foi assim
      # que 4 refs de tipo quebradas (toast.d.ts não emitido + TableDoc excluído)
      # chegaram a passar meses. BLOQUEANTE porque é determinístico e hoje verde;
      # o `grep` evita rodar o build da lib nas PRs que não podem afetá-lo.
      - name: Pacote npm íntegro (lib:verify — só se tocou o que o afeta)
        if: ${{ !cancelled() }}
        run: |
          BASE="origin/${{ github.base_ref || 'main' }}"
          if git diff --name-only "$BASE"...HEAD \
             | grep -qE '^(src/components/|vite\.lib\.config\.ts|tsconfig\.lib\.json|package\.json)'; then
            npm run lib:verify
          else
            echo "sem toque em src/components/, vite.lib.config.ts, tsconfig.lib.json ou package.json — pulado"
          fi
